version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
    open-pull-requests-limit: 10
    groups:
      # Group minor/patch production dependency updates together
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      # Group all dev dependency updates together
      dev-deps:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # minimatch 11 fixes GHSA-g3hv-75wg-m249 but eslint 10.13.0 still requires
      # minimatch ^10.2.x through @eslint/config-array, so the security update
      # cannot resolve. Retrying it every day only produces a failed run, which
      # is why the version is skipped here until eslint widens the range.
      - dependency-name: "minimatch"
      # Major upgrades for these packages require manual vetting
      - dependency-name: "webpack"
        update-types: ["version-update:semver-major"]
      - dependency-name: "webpack-cli"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pdfjs-dist"
        update-types: ["version-update:semver-major"]
      - dependency-name: "socket.io"
        update-types: ["version-update:semver-major"]
      - dependency-name: "socket.io-client"
        update-types: ["version-update:semver-major"]
      - dependency-name: "express"
        update-types: ["version-update:semver-major"]
      - dependency-name: "redis"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
